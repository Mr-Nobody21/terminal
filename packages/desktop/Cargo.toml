[package]
name = "cloud-architecture-planner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
