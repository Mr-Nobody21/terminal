name: Dependency and application checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [feat/next-implementation]
  schedule:
    - cron: '20 5 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: isolated-ci-test-only
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm run test:backend:integration
        env:
          TEST_DATABASE_URL: postgresql://planner_test:isolated-ci-test-only@localhost:5432/planner_test
